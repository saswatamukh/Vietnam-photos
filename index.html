<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnam, through my lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <p class="eyebrow">A photo journal</p>
  <h1>Vietnam</h1>
  <p class="lede">A trip, one frame at a time.</p>
  <p class="count" id="total"></p>
  <a class="scroll" href="#gallery" aria-label="Scroll to photos">Scroll <span>↓</span></a>
</section>

<main class="gallery" id="gallery"></main>

<footer class="end">
  <p>Thanks for scrolling.</p>
</footer>

<button class="top" id="toTopBtn" aria-label="Back to top" hidden>↑</button>

<div class="lb" id="lb" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav next" id="lbNext" aria-label="Next photo">›</button>
  <p class="lb-info"><span id="lbCap"></span><span id="lbCount"></span></p>
</div>

<script>
/* ============================================================
   FILE NAMES FOR THE NON-CAMERA PHOTOS
   Names are written without ".jpg". A space is written as %20.
   If a file is not a .jpg, write the ending too,
   for example "Untitled%20design%204.png"
   ============================================================ */
const UD  = "Untitled%20design";
const UD4 = "Untitled%20design4";
const UD5 = "Untitled%20design5";
const IMG = "imgcompressors-edited-image-1791903300657";

/* ============================================================
   LAYOUT
   Each [ ... ] is one row, shown top to bottom.
   - one name  = one big photo
   - two names = two photos side by side
   Names are file names without ".jpg".
   ============================================================ */
const ROWS = [
  ["DSCF0132"],
  ["DSCF0136", "DSCF0137"],
  ["DSCF0142"],
  ["DSCF0147"],
  ["DSCF0149", "DSCF0152"],
  ["DSCF0153"],
  ["DSCF0163", "DSCF0168"],
  ["DSCF0171"],
  ["DSCF0175"],
  ["DSCF0187"],
  ["DSCF0243", "DSCF0265"],
  ["DSCF0274"],
  ["DSCF0290", "DSCF0300"],
  ["DSCF0306", "DSCF0323"],
  ["DSCF0327"],
  ["DSCF0354"],
  ["DSCF0390", "DSCF0405"],
  ["DSCF0407"],
  ["DSCF0408", "DSCF0409"],
  ["DSCF0416"],
  ["DSCF0463", "DSCF0466"],
  ["DSCF0470"],
  ["DSCF0471", "DSCF0518"],
  ["DSCF0530"],
  ["DSCF0566", "DSCF0575"],
  ["DSCF0607"],
  ["DSCF0618"],
  ["DSCF0625", "DSCF0631"],
  [UD4, "DSCF0599"],
  ["DSCF0604", UD],
  ["DSCF0646", "DSCF0652"],
  ["DSCF0669"],
  ["DSCF0675", "DSCF0683"],
  ["DSCF0692"],
  [IMG],
  ["DSCF0702", "DSCF0709"],
  ["DSCF0718", "DSCF0719"],
  ["DSCF0720"],
  ["DSCF0738"],
  [UD5],
];

/* Optional captions, for example:  DSCF0132: "Hanoi, early morning"  */
const CAPTIONS = {
  // DSCF0132: "Hanoi, early morning",
};

/* How strong the background tint gets (0 = none, 1 = full photo colour).
   0.25 to 0.35 gives a soft wash. */
const TINT_STRENGTH = 0.30;
/* ============================================================ */

const $ = id => document.getElementById(id);
const gallery = $("gallery");

// Flat list in display order (used by the full-screen viewer)
const PHOTOS = ROWS.flat().map(name => ({
  file: /\.\w+$/.test(name) ? name : name + ".jpg",
  caption: CAPTIONS[name] || ""
}));
$("total").textContent = PHOTOS.length + " photographs";

/* ---------- Find the main colour of a photo ---------- */
function mainColor(img) {
  try {
    const s = 40;
    const c = document.createElement("canvas");
    c.width = c.height = s;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, s, s);
    const d = ctx.getImageData(0, 0, s, s).data;
    const bins = {};
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      if (max < 35 || min > 225) continue;               // skip near-black and near-white
      const sat = (max - min) / max;
      const w = 0.15 + sat;                              // favour colourful pixels
      const key = (r >> 5) << 6 | (g >> 5) << 3 | (b >> 5);
      const bin = bins[key] || (bins[key] = { w: 0, r: 0, g: 0, b: 0 });
      bin.w += w; bin.r += r * w; bin.g += g * w; bin.b += b * w;
    }
    let best = null;
    for (const k in bins) if (!best || bins[k].w > best.w) best = bins[k];
    if (!best) return null;
    return [best.r / best.w, best.g / best.w, best.b / best.w];
  } catch (e) {
    return null;
  }
}

/* ---------- Build rows ---------- */
const figures = [];
let photoIndex = 0;
ROWS.forEach(names => {
  const row = document.createElement("div");
  row.className = "row r" + names.length;
  names.forEach(() => {
    const ph = PHOTOS[photoIndex];
    const idx = photoIndex++;
    const fig = document.createElement("figure");
    fig.className = "item";
    const img = new Image();
    img.src = ph.file;
    img.alt = ph.caption || "Vietnam photo " + (idx + 1);
    img.loading = "lazy";
    img.decoding = "async";
    img.addEventListener("load", () => {
      fig.style.setProperty("--r", img.naturalWidth / img.naturalHeight);
      fig._color = mainColor(img);
      updateBackground();
    });
    img.addEventListener("click", () => openLb(idx));
    fig.appendChild(img);
    if (ph.caption) {
      const c = document.createElement("figcaption");
      c.textContent = ph.caption;
      fig.appendChild(c);
    }
    row.appendChild(fig);
    figures.push(fig);
  });
  gallery.appendChild(row);
});

/* ---------- Fade-in on scroll ---------- */
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -8% 0px" });
  figures.forEach(f => io.observe(f));
} else {
  figures.forEach(f => f.classList.add("in"));
}

/* ---------- Background tint from the photo in view ---------- */
let lastBg = "";
let bgQueued = false;
function updateBackground() {
  bgQueued = false;
  const vh = window.innerHeight;
  const mid = vh / 2;

  // photo whose centre is closest to the middle of the screen
  let best = null, bestDist = Infinity;
  for (const f of figures) {
    const r = f.getBoundingClientRect();
    if (r.bottom < 0 || r.top > vh) continue;
    const dist = Math.abs((r.top + r.bottom) / 2 - mid);
    if (dist < bestDist) { bestDist = dist; best = f; }
  }

  // stays white at the top, fades in as you start scrolling
  const ramp = Math.min(1, window.scrollY / (vh * 0.7));
  let bg = "rgb(255, 255, 255)";
  if (best && best._color) {
    const a = TINT_STRENGTH * ramp;
    const [r, g, b] = best._color;
    bg = "rgb(" + [r, g, b].map(v => Math.round(255 * (1 - a) + v * a)).join(", ") + ")";
  }
  if (bg !== lastBg) { document.body.style.backgroundColor = bg; lastBg = bg; }
}
function queueBg() {
  if (!bgQueued) { bgQueued = true; requestAnimationFrame(updateBackground); }
}
addEventListener("scroll", queueBg, { passive: true });
addEventListener("resize", queueBg);
updateBackground();

/* ---------- Back to top ---------- */
const topBtn = $("toTopBtn");
addEventListener("scroll", () => { topBtn.hidden = window.scrollY < 700; }, { passive: true });
topBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

/* ---------- Lightbox ---------- */
const lb = $("lb"), lbImg = $("lbImg");
let cur = 0;
function showLb(n) {
  cur = (n + PHOTOS.length) % PHOTOS.length;
  lbImg.src = PHOTOS[cur].file;
  $("lbCap").textContent = PHOTOS[cur].caption || "";
  $("lbCount").textContent = (cur + 1) + " / " + PHOTOS.length;
}
function openLb(n) { showLb(n); lb.hidden = false; document.body.style.overflow = "hidden"; }
function closeLb() { lb.hidden = true; document.body.style.overflow = ""; }
$("lbClose").onclick = closeLb;
$("lbPrev").onclick = () => showLb(cur - 1);
$("lbNext").onclick = () => showLb(cur + 1);
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowRight") showLb(cur + 1);
  else if (e.key === "ArrowLeft") showLb(cur - 1);
});
let touchStartX = null;
lb.addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) showLb(cur + (dx < 0 ? 1 : -1));
  touchStartX = null;
});
</script>
</body>
</html>
