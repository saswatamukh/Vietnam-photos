<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam, through my lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d2526;
    --paper: #eef1e8;
    --lotus: #e58ca5;
    --brass: #c9a24b;
    --muted: rgba(238, 241, 232, .62);
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Ambient backdrop: the current photo, blurred */
  .ambient {
    position: fixed; inset: -60px;
    background-size: cover; background-position: center;
    filter: blur(60px) saturate(1.3) brightness(.45);
    transition: background-image .8s ease;
    z-index: 0;
  }
  .shade {
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(to bottom, rgba(13,37,38,.55), rgba(13,37,38,0) 30%, rgba(13,37,38,0) 60%, rgba(13,37,38,.85));
  }

  .app {
    position: relative; z-index: 2;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: max(20px, env(safe-area-inset-top)) clamp(16px, 4vw, 48px) max(16px, env(safe-area-inset-bottom));
    gap: 16px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    line-height: .95;
    letter-spacing: -.03em;
  }
  .sub { color: var(--muted); font-weight: 300; font-size: .95rem; margin-top: 8px; }
  .tools { display: flex; gap: 8px; }
  .tools button, .arrow {
    background: rgba(238,241,232,.1);
    color: var(--paper);
    border: 1px solid rgba(238,241,232,.2);
    border-radius: 999px;
    height: 42px; min-width: 42px; padding: 0 16px;
    font: 400 .85rem var(--body);
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background .2s, border-color .2s;
  }
  .tools button:hover, .arrow:hover { background: rgba(238,241,232,.2); }
  .tools button[aria-pressed="true"] { background: var(--lotus); border-color: var(--lotus); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

  /* Stage */
  .stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .frame {
    position: relative;
    height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
    touch-action: pan-y;
  }
  .frame img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    transition: opacity .35s ease, transform .35s ease;
    user-select: none; -webkit-user-drag: none;
  }
  .frame img.out { opacity: 0; transform: scale(.98); }
  .missing {
    display: none;
    width: min(560px, 90%); aspect-ratio: 4/3;
    border-radius: 14px;
    background: linear-gradient(135deg, #1d4a47, #0d2526);
    border: 1px dashed rgba(238,241,232,.3);
    align-items: center; justify-content: center; text-align: center;
    color: var(--muted); padding: 24px; font-size: .9rem; line-height: 1.6;
  }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; padding: 0; font-size: 1.3rem; z-index: 3; }
  .arrow.prev { left: 0; } .arrow.next { right: 0; }

  /* Footer */
  footer { display: grid; gap: 12px; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .caption { font-family: var(--display); font-size: clamp(1.1rem, 2.4vw, 1.5rem); font-weight: 500; letter-spacing: -.01em; }
  .count { color: var(--brass); font-size: .9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .progress { height: 2px; background: rgba(238,241,232,.15); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--lotus); }
  .strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px;
    scrollbar-width: none; scroll-behavior: smooth;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip button {
    flex: 0 0 auto; width: 72px; height: 54px; padding: 0;
    border: 2px solid transparent; border-radius: 8px; overflow: hidden;
    background: #1d4a47; cursor: pointer; opacity: .55;
    transition: opacity .2s, border-color .2s;
  }
  .strip button:hover { opacity: .9; }
  .strip button.on { opacity: 1; border-color: var(--lotus); }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (max-width: 640px) {
    .arrow { display: none; }
    .tools button .label { display: none; }
    .tools button { padding: 0 12px; }
    .strip button { width: 60px; height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>
<div class="shade"></div>

<div class="app">
  <header>
    <div>
      <h1>Vietnam</h1>
      <p class="sub">A trip, one frame at a time</p>
    </div>
    <div class="tools">
      <button id="play" aria-pressed="false" aria-label="Toggle slideshow">▶ <span class="label">Play</span></button>
      <button id="full" aria-label="Toggle full screen">⛶ <span class="label">Full screen</span></button>
    </div>
  </header>

  <main class="stage">
    <button class="arrow prev" id="prev" aria-label="Previous photo">‹</button>
    <div class="frame" id="frame">
      <img id="photo" alt="">
      <div class="missing" id="missing"></div>
    </div>
    <button class="arrow next" id="next" aria-label="Next photo">›</button>
  </main>

  <footer>
    <div class="meta">
      <div class="caption" id="caption"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="strip" id="strip" role="tablist" aria-label="Photo thumbnails"></div>
  </footer>
</div>

<script>
/* ============================================================
   PHOTO LIST
   Photos sit in the same folder as this index.html.
   "caption" is optional: add  caption: "Hanoi"  to any entry.
   ============================================================ */
const PHOTOS = [
  { file: "DSCF0132.jpg" },
  { file: "DSCF0136.jpg" },
  { file: "DSCF0137.jpg" },
  { file: "DSCF0142.jpg" },
  { file: "DSCF0147.jpg" },
  { file: "DSCF0149.jpg" },
  { file: "DSCF0152.jpg" },
  { file: "DSCF0153.jpg" },
  { file: "DSCF0163.jpg" },
  { file: "DSCF0168.jpg" },
  { file: "DSCF0171.jpg" },
  { file: "DSCF0175.jpg" },
  { file: "DSCF0187.jpg" },
  { file: "DSCF0243.jpg" },
  { file: "DSCF0265.jpg" },
  { file: "DSCF0274.jpg" },
  { file: "DSCF0285.jpg" },
  { file: "DSCF0290.jpg" },
  { file: "DSCF0300.jpg" },
  { file: "DSCF0306.jpg" },
  { file: "DSCF0323.jpg" },
  { file: "DSCF0327.jpg" },
  { file: "DSCF0354.jpg" },
  { file: "DSCF0390.jpg" },
  { file: "DSCF0405.jpg" },
  { file: "DSCF0407.jpg" },
  { file: "DSCF0408.jpg" },
  { file: "DSCF0409.jpg" },
  { file: "DSCF0416.jpg" },
  { file: "DSCF0451.jpg" },
  { file: "DSCF0452.jpg" },
  { file: "DSCF0463.jpg" },
  { file: "DSCF0466.jpg" },
  { file: "DSCF0470.jpg" },
  { file: "DSCF0471.jpg" },
  { file: "DSCF0518.jpg" },
  { file: "DSCF0530.jpg" },
  { file: "DSCF0552.jpg" },
  { file: "DSCF0566.jpg" },
  { file: "DSCF0575.jpg" },
  { file: "DSCF0597.jpg" },
  { file: "DSCF0599.jpg" },
  { file: "DSCF0604.jpg" },
  { file: "DSCF0607.jpg" },
  { file: "DSCF0618.jpg" },
  { file: "DSCF0625.jpg" },
  { file: "DSCF0631.jpg" },
  { file: "DSCF0646.jpg" },
  { file: "DSCF0652.jpg" },
  { file: "DSCF0669.jpg" },
  { file: "DSCF0675.jpg" },
  { file: "DSCF0683.jpg" },
  { file: "DSCF0692.jpg" },
  { file: "DSCF0702.jpg" },
  { file: "DSCF0709.jpg" },
  { file: "DSCF0718.jpg" },
  { file: "DSCF0719.jpg" },
  { file: "DSCF0720.jpg" },
  { file: "DSCF0738.jpg" },
  { file: "DSCF0754.jpg" },
  { file: "Untitled%20design.jpg" },
  { file: "imgcompressors-edited-image-1791903300657.jpg" },
];
const SLIDE_SECONDS = 4;   // time per photo in slideshow mode
/* ============================================================ */

const $ = id => document.getElementById(id);
const photo = $("photo"), missing = $("missing"), strip = $("strip");
let index = 0, timer = null, raf = null, started = 0;

// Build thumbnails
PHOTOS.forEach((p, i) => {
  const b = document.createElement("button");
  b.setAttribute("role", "tab");
  b.setAttribute("aria-label", "Photo " + (i + 1));
  const img = new Image();
  img.src = p.file; img.loading = "lazy"; img.alt = "";
  img.onerror = () => img.remove();
  b.appendChild(img);
  b.onclick = () => { go(i); restartIfPlaying(); };
  strip.appendChild(b);
});

function show(i) {
  const p = PHOTOS[i];
  missing.style.display = "none";
  photo.style.display = "";
  photo.onerror = () => {
    photo.style.display = "none";
    missing.style.display = "flex";
    missing.textContent = "Couldn't find " + p.file + ". Check the file name and that it is in the same folder as index.html.";
  };
  photo.src = p.file;
  photo.alt = p.caption || "Vietnam photo " + (i + 1);
  $("ambient").style.backgroundImage = `url("${p.file}")`;
  $("caption").textContent = p.caption || "";
  $("count").textContent = (i + 1) + " / " + PHOTOS.length;
  [...strip.children].forEach((b, n) => {
    b.classList.toggle("on", n === i);
    b.setAttribute("aria-selected", n === i);
  });
  const t = strip.children[i];
  strip.scrollTo({ left: t.offsetLeft - strip.clientWidth / 2 + t.clientWidth / 2 });
  // preload neighbours
  [i + 1, i - 1].forEach(n => { const q = PHOTOS[(n + PHOTOS.length) % PHOTOS.length]; new Image().src = q.file; });
}

function go(i) {
  index = (i + PHOTOS.length) % PHOTOS.length;
  photo.classList.add("out");
  setTimeout(() => { show(index); photo.classList.remove("out"); }, 180);
}
const next = () => go(index + 1), prev = () => go(index - 1);

$("next").onclick = () => { next(); restartIfPlaying(); };
$("prev").onclick = () => { prev(); restartIfPlaying(); };

// Keyboard
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { next(); restartIfPlaying(); }
  else if (e.key === "ArrowLeft") { prev(); restartIfPlaying(); }
  else if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key.toLowerCase() === "f") toggleFull();
});

// Swipe
let sx = null;
const frame = $("frame");
frame.addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
frame.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); restartIfPlaying(); }
  sx = null;
});

// Slideshow
function tick(now) {
  const pct = Math.min((now - started) / (SLIDE_SECONDS * 1000), 1);
  $("bar").style.width = pct * 100 + "%";
  if (pct >= 1) { next(); started = now; }
  raf = requestAnimationFrame(tick);
}
function play() {
  started = performance.now();
  raf = requestAnimationFrame(tick);
  timer = true;
  $("play").setAttribute("aria-pressed", "true");
  $("play").innerHTML = '❚❚ <span class="label">Pause</span>';
}
function pause() {
  cancelAnimationFrame(raf); timer = null;
  $("bar").style.width = "0";
  $("play").setAttribute("aria-pressed", "false");
  $("play").innerHTML = '▶ <span class="label">Play</span>';
}
function toggle() { timer ? pause() : play(); }
function restartIfPlaying() { if (timer) { cancelAnimationFrame(raf); started = performance.now(); raf = requestAnimationFrame(tick); } }
$("play").onclick = toggle;

// Full screen
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}
$("full").onclick = toggleFull;

show(0);
</script>
</body>
</html>
