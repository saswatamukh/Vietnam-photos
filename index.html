<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnam, through my lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <p class="eyebrow">A photo journal</p>
  <h1>Vietnam</h1>
  <p class="lede">A trip, one frame at a time.</p>
  <p class="count" id="total"></p>
  <a class="scroll" href="#gallery" aria-label="Scroll to photos">Scroll <span>↓</span></a>
</section>

<main class="gallery" id="gallery"></main>

<footer class="end">
  <p>Thanks for scrolling.</p>
</footer>

<button class="top" id="top" aria-label="Back to top" hidden>↑</button>

<div class="lb" id="lb" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav next" id="lbNext" aria-label="Next photo">›</button>
  <p class="lb-info"><span id="lbCap"></span><span id="lbCount"></span></p>
</div>

<script>
/* ============================================================
   PHOTO LIST
   Photos sit in the same folder as this index.html.
   Add a caption to any entry like:  { file: "DSCF0132.jpg", caption: "Hanoi" }
   ============================================================ */
const PHOTOS = [
  { file: "DSCF0132.jpg" },
  { file: "DSCF0136.jpg" },
  { file: "DSCF0137.jpg" },
  { file: "DSCF0142.jpg" },
  { file: "DSCF0147.jpg" },
  { file: "DSCF0149.jpg" },
  { file: "DSCF0152.jpg" },
  { file: "DSCF0153.jpg" },
  { file: "DSCF0163.jpg" },
  { file: "DSCF0168.jpg" },
  { file: "DSCF0171.jpg" },
  { file: "DSCF0175.jpg" },
  { file: "DSCF0187.jpg" },
  { file: "DSCF0243.jpg" },
  { file: "DSCF0265.jpg" },
  { file: "DSCF0274.jpg" },
  { file: "DSCF0285.jpg" },
  { file: "DSCF0290.jpg" },
  { file: "DSCF0300.jpg" },
  { file: "DSCF0306.jpg" },
  { file: "DSCF0323.jpg" },
  { file: "DSCF0327.jpg" },
  { file: "DSCF0354.jpg" },
  { file: "DSCF0390.jpg" },
  { file: "DSCF0405.jpg" },
  { file: "DSCF0407.jpg" },
  { file: "DSCF0408.jpg" },
  { file: "DSCF0409.jpg" },
  { file: "DSCF0416.jpg" },
  { file: "DSCF0451.jpg" },
  { file: "DSCF0452.jpg" },
  { file: "DSCF0463.jpg" },
  { file: "DSCF0466.jpg" },
  { file: "DSCF0470.jpg" },
  { file: "DSCF0471.jpg" },
  { file: "DSCF0518.jpg" },
  { file: "DSCF0530.jpg" },
  { file: "DSCF0552.jpg" },
  { file: "DSCF0566.jpg" },
  { file: "DSCF0575.jpg" },
  { file: "DSCF0597.jpg" },
  { file: "DSCF0599.jpg" },
  { file: "DSCF0604.jpg" },
  { file: "DSCF0607.jpg" },
  { file: "DSCF0618.jpg" },
  { file: "DSCF0625.jpg" },
  { file: "DSCF0631.jpg" },
  { file: "DSCF0646.jpg" },
  { file: "DSCF0652.jpg" },
  { file: "DSCF0669.jpg" },
  { file: "DSCF0675.jpg" },
  { file: "DSCF0683.jpg" },
  { file: "DSCF0692.jpg" },
  { file: "DSCF0702.jpg" },
  { file: "DSCF0709.jpg" },
  { file: "DSCF0718.jpg" },
  { file: "DSCF0719.jpg" },
  { file: "DSCF0720.jpg" },
  { file: "DSCF0738.jpg" },
  { file: "DSCF0754.jpg" },
  { file: "Untitled%20design.jpg" },
  { file: "imgcompressors-edited-image-1791903300657.jpg" },
];

/* Layout rhythm: 1 = one big photo, 2 = two side by side.
   The pattern repeats down the page. Change it however you like. */
const PATTERN = [1, 2, 1, 1, 2, 1, 2, 1];
/* ============================================================ */

const $ = id => document.getElementById(id);
const gallery = $("gallery");
$("total").textContent = PHOTOS.length + " photographs";

// Build rows
const imgs = [];
let i = 0, p = 0;
while (i < PHOTOS.length) {
  const n = Math.min(PATTERN[p++ % PATTERN.length], PHOTOS.length - i);
  const row = document.createElement("div");
  row.className = "row r" + n;
  for (let k = 0; k < n; k++, i++) {
    const ph = PHOTOS[i];
    const fig = document.createElement("figure");
    fig.className = "item";
    const img = new Image();
    img.src = ph.file;
    img.alt = ph.caption || "Vietnam photo " + (i + 1);
    img.loading = "lazy";
    img.decoding = "async";
    const idx = i;
    img.addEventListener("load", () => fig.style.setProperty("--r", img.naturalWidth / img.naturalHeight));
    img.addEventListener("click", () => openLb(idx));
    fig.appendChild(img);
    if (ph.caption) {
      const c = document.createElement("figcaption");
      c.textContent = ph.caption;
      fig.appendChild(c);
    }
    row.appendChild(fig);
    imgs.push(fig);
  }
  gallery.appendChild(row);
}

// Fade-in on scroll
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -8% 0px" });
  imgs.forEach(f => io.observe(f));
} else {
  imgs.forEach(f => f.classList.add("in"));
}

// Back to top
const top = $("top");
addEventListener("scroll", () => { top.hidden = scrollY < 700; }, { passive: true });
top.onclick = () => scrollTo({ top: 0, behavior: "smooth" });

// Lightbox
const lb = $("lb"), lbImg = $("lbImg");
let cur = 0;
function showLb(n) {
  cur = (n + PHOTOS.length) % PHOTOS.length;
  lbImg.src = PHOTOS[cur].file;
  $("lbCap").textContent = PHOTOS[cur].caption || "";
  $("lbCount").textContent = (cur + 1) + " / " + PHOTOS.length;
}
function openLb(n) { showLb(n); lb.hidden = false; document.body.style.overflow = "hidden"; }
function closeLb() { lb.hidden = true; document.body.style.overflow = ""; }
$("lbClose").onclick = closeLb;
$("lbPrev").onclick = () => showLb(cur - 1);
$("lbNext").onclick = () => showLb(cur + 1);
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowRight") showLb(cur + 1);
  else if (e.key === "ArrowLeft") showLb(cur - 1);
});
let sx = null;
lb.addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
lb.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) showLb(cur + (dx < 0 ? 1 : -1));
  sx = null;
});
</script>
</body>
</html>
